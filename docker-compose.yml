services:
  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"

  resolve:
    build:
      context: .
      target: resolve
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  reconcile:
    build:
      context: .
      target: reconcile
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nmap-discover:
    build:
      context: .
      target: nmap
    entrypoint: ["nmap-discover-worker"]
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-discover.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nmap-quick:
    build:
      context: .
      target: nmap
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-quick.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nmap-http:
    build:
      context: .
      target: nmap
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-http.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nmap-full:
    build:
      context: .
      target: nmap
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-full.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nmap-svc:
    build:
      context: .
      target: nmap
    entrypoint: ["nmap-svc-worker"]
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-svc.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  as-url:
    build:
      context: .
      target: nmap
    entrypoint: ["asurl-worker"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  dnsx:
    build:
      context: .
      target: dnsx
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  ctl:
    build:
      context: .
      target: ctl
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  tlsx:
    build:
      context: .
      target: tlsx
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  httpx:
    build:
      context: .
      target: httpx
    environment:
      NATS_URL: nats://nats:4222
      HTTPX_PROFILE: /profiles/httpx.yaml
      SCREENSHOT_DIR: /screenshots
    volumes:
      - ./screenshots:/screenshots
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nuclei:
    build:
      context: .
      target: nuclei
    environment:
      NATS_URL: nats://nats:4222
      NUCLEI_PROFILE: /profiles/nuclei.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  nuclei-net:
    build:
      context: .
      target: nuclei
    environment:
      NATS_URL: nats://nats:4222
      NUCLEI_PROFILE: /profiles/nuclei-net.yaml
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  report:
    build:
      context: .
      target: report
    environment:
      NATS_URL: nats://nats:4222
      REPORT_FILE: /reports/events.jsonl
    volumes:
      - ./reports:/reports
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  export:
    build:
      context: .
      target: export
    environment:
      NATS_URL: nats://nats:4222
      EXPORT_FILE: /exports/events.jsonl
    volumes:
      - ./exports:/exports
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  watch:
    build:
      context: .
      target: watch
    environment:
      NATS_URL: nats://nats:4222
      WATCH_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on: [nats]
    restart: unless-stopped
    stop_grace_period: 30s

  seed:
    build:
      context: .
      target: seed
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    profiles: ["seed"]

  work:
    build:
      context: .
      target: work
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    profiles: ["ops"]

  dev:
    image: golang:1.26-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NATS_URL: nats://nats:4222
    command: sleep infinity
    depends_on: [nats]

volumes:
  nats-data:
