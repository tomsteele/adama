services:
  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"

  nmap-discover:
    build:
      context: .
      target: nmap
    entrypoint: ["nmap-discover-worker"]
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-discover.yaml
    depends_on: [nats]
    restart: unless-stopped

  nmap-quick:
    build:
      context: .
      target: nmap
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-quick.yaml
    depends_on: [nats]
    restart: unless-stopped

  nmap-http:
    build:
      context: .
      target: nmap
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-http.yaml
    depends_on: [nats]
    restart: unless-stopped

  nmap-full:
    build:
      context: .
      target: nmap
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-full.yaml
    depends_on: [nats]
    restart: unless-stopped

  nmap-svc:
    build:
      context: .
      target: nmap
    entrypoint: ["nmap-svc-worker"]
    environment:
      NATS_URL: nats://nats:4222
      NMAP_PROFILE: /profiles/nmap-svc.yaml
    depends_on: [nats]
    restart: unless-stopped

  as-url:
    build:
      context: .
      target: nmap
    entrypoint: ["asurl-worker"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped

  dnsx:
    build:
      context: .
      target: dnsx
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped

  tlsx:
    build:
      context: .
      target: tlsx
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    restart: unless-stopped

  httpx:
    build:
      context: .
      target: httpx
    environment:
      NATS_URL: nats://nats:4222
      HTTPX_PROFILE: /profiles/httpx.yaml
      SCREENSHOT_DIR: /screenshots
    volumes:
      - ./screenshots:/screenshots
    depends_on: [nats]
    restart: unless-stopped

  nuclei:
    build:
      context: .
      target: nuclei
    environment:
      NATS_URL: nats://nats:4222
      NUCLEI_PROFILE: /profiles/nuclei.yaml
    depends_on: [nats]
    restart: unless-stopped

  report:
    build:
      context: .
      target: report
    environment:
      NATS_URL: nats://nats:4222
      REPORT_FILE: /reports/events.jsonl
    volumes:
      - ./reports:/reports
    depends_on: [nats]
    restart: unless-stopped

  seed:
    build:
      context: .
      target: seed
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats]
    profiles: ["seed"]

  dev:
    image: golang:1.26-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      NATS_URL: nats://nats:4222
    command: sleep infinity
    depends_on: [nats]
