name: httpx
kinds: [url]
ack_wait: 5m
# These extra arguments apply when a hostname URL has a known backend IP.
# The task-local resolver pins only that name; other names use resolv.conf.
# Set resolvers: ["10.0.0.53:53"] to choose upstream DNS in your environment.
bound_args:
  - -r
  - "{resolver}"
browser:
  timeout: 30s
  idle: 1s
  max_redirects: 10
  width: 1080
  height: 1920
  full_page: false
  bound_args:
    - "--host-resolver-rules=MAP {name} {ip}"
  args:
    - --no-sandbox
    - --disable-dev-shm-usage
    - --ignore-certificate-errors
    - --no-proxy-server
    - --disable-quic
    - --hide-scrollbars
# HTTP probes remain independent of the browser's final document. Chromium
# captures screenshots directly so each image has its own response endpoint.
httpx_args:
  - -silent
  - -json
  - -no-fallback-scheme
  - -title
  - -sc
  - -td
  - -server
  - -ip
  - -cname
  - -location
  - -favicon
  - -jarm
  - -asn
  - -cdn
  - -probe
