# Full TCP + common UDP on a live IP only (discover). Ten vhosts share one scan.
name: nmap-full
kinds: [ip]
ack_wait: 2h
ipv6_args: ["-6"]
nmap_args:
  - --min-rate=150
  - --min-hostgroup=25
  - --max-retries=2
  - --initial-rtt-timeout=250ms
  - --max-rtt-timeout=400ms
  - --max-scan-delay=5
  - -Pn
  - -sT
  - -sU
  - --open
  - -p
  - T:1-65535,U:53,67-69,111,123,135,137-139,161-162,445,500,514,520,623,631,996-999,1434,1701,1900,3283,4500,5353,49152-49154
