# -sC is default-only; safe+discovery is where ssh2-enum-algos and most useful NSE live.
name: nmap-svc
kinds: [port]
ack_wait: 10m
ipv6_args: ["-6"]
transport_args:
  tcp: ["-sT"]
hostname_args: ["--script-args", "tls.servername={name},http.host={name}"]
nmap_args: ["-Pn", "-n", "--open", "-sV", "--script", "default,safe,discovery"]
