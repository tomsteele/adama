# top-ports after discover. ip once per address; fqdn again so each live vhost gets SNI ports.
name: nmap-quick
kinds: [ip, fqdn]
ack_wait: 10m
ipv6_args: ["-6"]
nmap_args:
  - --min-rate=150
  - --min-hostgroup=25
  - --max-retries=2
  - --initial-rtt-timeout=250ms
  - --max-rtt-timeout=400ms
  - --max-scan-delay=5
  - -Pn
  - -n
  - -sT
  - --open
  - --top-ports
  - "250"
