name: nuclei-net
kinds: [service]
ack_wait: 15m
task_timeout: 10m
# Worker appends -u host:port (skips http/https). Unsupported transports fail
# once, visibly; a TCP scan must never establish coverage of a UDP endpoint.
service_transports: [tcp]
bound_args:
  - -r
  - "{resolver_file}"
trace_args:
  - -trace-log
  - "{trace_file}"
nuclei_args:
  - -t
  - /opt/nuclei-templates
  - -silent
  - -jsonl
  - -omit-template
  - -ss
  - host-spray
  - -pt
  # DNS templates query resolvers, not this service endpoint. JavaScript can
  # choose its own transport/endpoint; it needs template-specific accounting.
  - ssl,tcp
  - -etags
  - dos,fuzz
  - -rl
  - "80"
  - -c
  - "15"
  - -retries
  - "2"
  - -timeout
  - "10"
  - -duc
