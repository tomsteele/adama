# common HTTP/S ports after discover. ip for the address; fqdn so late vhosts still get :8443 + SNI.
name: nmap-http
kinds: [ip, fqdn]
ack_wait: 10m
nmap_args:
  - -Pn
  - -n
  - --open
  - -p
  - 80,81,443,2083,2087,3000,4443,5000,5601,6443,7443,8000,8008,8080,8081,8088,8443,8444,8880,8888,9000,9090,9200,9443,10443
