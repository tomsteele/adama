name: nuclei
kinds: [url]
ack_wait: 20m
task_timeout: 15m
# HTTP catalog on a live URL (not -as). Other protocols use nuclei-net.
# Keep interactsh (do not add -ni). Headless needs separate browser binding.
# swap in -as for a faster wappalyzer-tagged pass.
bound_args:
  - -r
  - "{resolver_file}"
trace_args:
  - -trace-log
  - "{trace_file}"
nuclei_args:
  - -t
  - /opt/nuclei-templates
  - -silent
  - -jsonl
  - -omit-template
  - -pt
  - http
  - -follow-redirects
  - -ss
  - host-spray
  - -etags
  - dos,fuzz
  - -rl
  - "150"
  - -c
  - "25"
  - -retries
  - "2"
  - -timeout
  - "10"
  - -duc
